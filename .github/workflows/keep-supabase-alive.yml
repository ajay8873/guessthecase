name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to keep the project active
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows running manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_4WUJG04ET75Wr8T0B24Yzg_gP5Ye4xX" \
            -H "Authorization: Bearer sb_publishable_4WUJG04ET75Wr8T0B24Yzg_gP5Ye4xX" \
            "https://lqzybdxtaqzpirdkaegf.supabase.co/rest/v1/cases?select=id&limit=1"
